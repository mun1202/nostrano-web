<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <!-- Aggiunta alla schermata Home: su iPhone è l'unico modo di ricevere le notifiche del browser. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Il mio contadino">
  <script>
    // Il sito può stare in una sottocartella (su GitHub Pages /nostrano-web/): gli indirizzi partono da lì.
    window.NOSTRANO_ROOT = location.pathname.replace(/\/(modifica|admin)(\/.*)?$/, '/').replace(/[^/]*$/, '')
    // Aperta dal pannello admin ("Modifica come il maso", ?admin=<slug>): si entra con l'identità dell'admin.
    if (new URLSearchParams(location.search).has('admin')) window.NOSTRANO_SESSION_KEY = 'nostrano.admin.session'
    document.write([
      '<link rel="icon" href="ROOT/assets/logo.svg" type="image/svg+xml">',
      '<link rel="apple-touch-icon" href="ROOT/assets/icon-180.png">',
      '<link rel="manifest" href="ROOT/modifica/manifest.webmanifest">',
      '<link rel="stylesheet" href="ROOT/assets/style.css?v=61e746c333">',
      '<script src="ROOT/config.js?v=61e746c333"><\/script>',
      '<script type="module" src="ROOT/assets/app.js?v=61e746c333"><\/script>',
    ].map((tag) => tag.replaceAll('ROOT/', window.NOSTRANO_ROOT)).join(''))
  </script>
  <title>Il mio contadino · Area produttore</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" data-root-href=""><img data-root-src="assets/logo.svg" alt="" width="26" height="32"><span>Il mio contadino</span></a>
    <nav id="nav" class="tabs" aria-label="Sezioni"></nav>
    <select id="lang" aria-label="Lingua">
      <option value="it">Italiano</option>
      <option value="de">Deutsch</option>
    </select>
  </header>
  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    for (const el of document.querySelectorAll('[data-root-src]')) el.src = window.NOSTRANO_ROOT + el.dataset.rootSrc
    for (const el of document.querySelectorAll('[data-root-href]')) el.href = window.NOSTRANO_ROOT + el.dataset.rootHref
  </script>
</body>
</html>
