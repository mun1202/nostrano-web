<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Il mio contadino</title>
  <meta name="description" content="Frutta, uova, formaggi, carne e vino comprati al maso, da chi li produce. Orari e prodotti aggiornati dai produttori.">
  <link rel="canonical" href="https://ilmiocontadino.com/">
  <link rel="alternate" hreflang="it" href="https://ilmiocontadino.com/it/">
  <link rel="alternate" hreflang="de" href="https://ilmiocontadino.com/de/">
  <link rel="alternate" hreflang="x-default" href="https://ilmiocontadino.com/">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="assets/manifest-it.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Il mio contadino">
  <script>
    // La prima lingua del browser tra italiano e tedesco; se non c'è nessuna delle due, italiano.
    const lingua = (navigator.languages?.length ? navigator.languages : [navigator.language])
      .map((l) => String(l).slice(0, 2).toLowerCase()).find((l) => l === 'it' || l === 'de')
    location.replace(lingua === 'de' ? 'de/' : 'it/')
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=it/"></noscript>
  <style>body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #18181b; background: #fff; } main { padding: 96px 24px; text-align: center; } a { color: inherit; margin: 0 10px; }</style>
</head>
<body>
  <main><a href="it/" lang="it" hreflang="it">Italiano</a> <a href="de/" lang="de" hreflang="de">Deutsch</a></main>
</body>
